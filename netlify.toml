# Netlify builds the prerendered site from main on every push.
# The build is fully static (Angular outputMode "static"): no functions, no server.

[build]
  command = "npm run build"
  publish = "dist/little-things-gift-baskets/browser"

[build.environment]
  # Angular 21 needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# Hashed bundles never change; cache them for a year. Pages and data revalidate.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
