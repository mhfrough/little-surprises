<!--

  this reel, from its approved script and its direction (see SKILL.md). Copy this file to
  promo/<name>-reel.html and build on it. Keep the engine parts (marked ENGINE) as they are.

  Contract with tools/render.js: window.reelReady (promise), window.startReel(), window.REEL
  { duration, width, height, cues }, and no autoplay when the URL has ?render.
  Preview: serve the repo root over HTTP and open the page.
-->
<!-- Load the product's own stylesheet here if you reuse its classes: <link rel="stylesheet" href="../styles.css"> -->
<style>
/* ================= ENGINE (keep) ================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#reel{position:absolute;left:0;top:0;width:calc(var(--W) * 1px);height:calc(var(--H) * 1px);overflow:hidden;transform-origin:0 0;
  -webkit-font-smoothing:antialiased}
/* Nothing moves until fonts are in; then every animation starts from 0 together */
body.hold *,body.hold *::before,body.hold *::after{animation-play-state:paused !important}
/* Measuring switches every animation off, so positions are the final, untransformed layout */
#reel.measure,#reel.measure *{animation:none !important;transition:none !important}
.r-clock{position:absolute;width:1px;height:1px;animation:r-clock var(--end) linear 0s both}
@keyframes r-clock{from{opacity:0}to{opacity:0}}
.r-ui{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;align-items:center;z-index:99;font:600 14px/1 system-ui;color:#eee}
.r-ui button{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:#eee;color:#111;font:inherit;cursor:pointer}
.r-ui span{padding:12px 14px;border-radius:999px;background:#222;font-variant-numeric:tabular-nums}
.render .r-ui{display:none}

/* ================= THIS REEL: "The Note Comes First" =================
   Direction: letter, 4:5, light blush paper, EB Garamond italic for the words, Cinzel for the name,
   fluid motion, one continuous pull-back from the note (the camera never moves in), asymmetric:
   text flush left, the basket low and right at the end. */
@font-face{font-family:'EB Garamond';font-style:italic;font-weight:400 800;src:url(fonts/EBGaramond-Italic-latin.woff2) format('woff2')}
@font-face{font-family:'Cinzel';font-weight:500;src:url(fonts/cinzel-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel';font-weight:600;src:url(fonts/cinzel-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format('woff2')}
:root{
  --paper:#f7e8ec; --ink:#1f1418; --ink-2:#5e4d54; --wine:#7a0f3d; --wine-ink:#3d0a20; --rose:#d86b8a; --blush:#e89cb3;
  --sage:#6e6d4f; --cream:#fbf4ea;
  --kraft:#c9a173; --kraft-2:#ad8256; --kraft-3:#e2c49c; --kraft-dk:#6f4f31;
  --ease:cubic-bezier(.65,0,.35,1); --ease-out:cubic-bezier(.22,1,.36,1);
  --serif:'EB Garamond',Georgia,serif; --brand:'Cinzel',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
#reel{background:var(--paper);color:var(--ink);font-family:var(--sans)}
/* film surface: paper grain and a soft vignette, fixed to the lens */
#reel::after{content:'';position:absolute;inset:0;z-index:40;pointer-events:none;opacity:.16;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .24  0 0 0 0 .04  0 0 0 0 .13  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#reel::before{content:'';position:absolute;inset:0;z-index:39;pointer-events:none;
  background:radial-gradient(120% 90% at 55% 55%,transparent 55%,rgba(61,10,32,.12) 100%)}

/* ---- the world: everything the camera sees; its transform is the camera (keyframes built from CUES below) ---- */
.world{position:absolute;left:0;top:0;width:1800px;height:2250px;transform-origin:0 0;animation:cam var(--end) linear 0s both}
.w-bg{position:absolute;inset:-1200px;background:
  radial-gradient(900px 620px at 50% 58%,#fcf1f4 0%,rgba(252,241,244,0) 70%),
  radial-gradient(700px 520px at 18% 30%,#f2dce3 0%,rgba(242,220,227,0) 70%),var(--paper)}
.petal{position:absolute;width:70px;height:46px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,var(--blush),var(--rose));opacity:.42;transform:rotate(var(--r))}
.floor-shadow{position:absolute;left:330px;top:1560px;width:1140px;height:150px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(61,10,32,.22),rgba(61,10,32,0));opacity:0;animation:fadeIn 1s var(--ease) calc(var(--basket) + .3s) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---- wrap: three folds of rose satin open behind the tag ---- */
.tissue{position:absolute;left:900px;top:1215px;width:0;height:0}
.fold{position:absolute;bottom:0;left:-160px;width:320px;height:480px;transform-origin:50% 100%;
  clip-path:polygon(50% 0,100% 74%,88% 100%,12% 100%,0 74%);
  background:linear-gradient(100deg,#b84a69 0%,#d86b8a 30%,#f4bccb 46%,#e48aa4 56%,#c45878 100%);
  animation:foldIn 1.15s var(--ease-out) var(--d) both}
.fold::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 40%,rgba(61,10,32,.18))}
.fold.f1{--r:-27deg;--x:-175px;height:430px}
.fold.f2{--r:2deg;--x:0px;height:540px}
.fold.f3{--r:29deg;--x:185px;height:450px}
@keyframes foldIn{from{transform:translateX(var(--x)) rotate(calc(var(--r) * .2)) scaleY(0)}to{transform:translateX(var(--x)) rotate(var(--r)) scaleY(1)}}

/* ---- the basket: back (inside + handle) and front (weave + rim) rise together ---- */
.b-rise{animation:bRise calc(var(--land) - var(--basket)) var(--ease-out) var(--basket) both}
@keyframes bRise{from{transform:translateY(1250px)}to{transform:none}}
.b-back{position:absolute;left:0;top:0}
.handle{position:absolute;left:400px;top:600px;width:1000px;height:640px;overflow:visible}
.b-in{position:absolute;left:452px;top:1148px;width:896px;height:86px;border-radius:50%;background:radial-gradient(closest-side,#4f3520,var(--kraft-dk))}
.b-front{position:absolute;left:0;top:0}
.b-body{position:absolute;left:450px;top:1180px;width:900px;height:430px;clip-path:polygon(0 0,100% 0,93% 100%,7% 100%);
  background:
    linear-gradient(90deg,rgba(60,35,15,.38),rgba(60,35,15,0) 20%,rgba(60,35,15,0) 80%,rgba(60,35,15,.38)),
    linear-gradient(180deg,rgba(60,35,15,0) 55%,rgba(60,35,15,.32)),
    repeating-linear-gradient(90deg,rgba(80,50,22,0) 0 40px,rgba(80,50,22,.28) 40px 44px),
    repeating-linear-gradient(180deg,var(--kraft) 0 22px,var(--kraft-3) 22px 27px,var(--kraft-2) 27px 33px,var(--kraft) 33px 52px)}
.rim{position:absolute;left:426px;top:1158px;width:948px;height:54px;border-radius:27px;
  background:repeating-linear-gradient(62deg,var(--kraft-3) 0 13px,var(--kraft-2) 13px 26px);
  box-shadow:inset 0 -8px 10px rgba(60,35,15,.35),inset 0 6px 8px rgba(255,240,220,.4),0 10px 18px rgba(61,10,32,.18)}

/* ---- treats drop in and settle ---- */
.treat{position:absolute;transform-origin:50% 100%;animation:drop .8s linear var(--d) both}
@keyframes drop{
  0%{transform:translateY(-1100px) rotate(var(--r0));animation-timing-function:cubic-bezier(.5,0,.9,.55)}
  62%{transform:translateY(0) rotate(var(--r));animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  80%{transform:translateY(-32px) rotate(calc(var(--r) * .7));animation-timing-function:cubic-bezier(.6,0,.8,.45)}
  100%{transform:translateY(0) rotate(var(--r))}}
.t-choc{left:515px;top:1062px;width:250px;height:160px;--r0:-30deg;--r:-9deg;border-radius:16px;
  background:linear-gradient(160deg,#9a1d50,var(--wine) 45%,#5a0a2c);box-shadow:inset 0 0 0 6px rgba(255,255,255,.08)}
.t-choc::before{content:'';position:absolute;left:0;right:0;top:62px;height:26px;background:var(--rose)}
.t-choc::after{content:'';position:absolute;top:0;bottom:0;left:150px;width:26px;background:var(--rose)}
.t-mithai{left:760px;top:1092px;width:270px;height:140px;--r0:24deg;--r:5deg;border-radius:12px;
  background:repeating-linear-gradient(45deg,rgba(216,107,138,.16) 0 2px,transparent 2px 22px),
             repeating-linear-gradient(-45deg,rgba(216,107,138,.16) 0 2px,transparent 2px 22px),#f6ead6;
  box-shadow:inset 0 -10px 0 rgba(110,109,79,.2)}
.t-mithai::after{content:'';position:absolute;left:0;right:0;top:44px;height:24px;background:var(--sage)}
.t-perfume{left:1040px;top:1008px;width:120px;height:196px;--r0:-40deg;--r:7deg;border-radius:22px 22px 18px 18px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.2) 38%,rgba(216,107,138,.55) 39%,#d86b8a);
  box-shadow:inset 8px 0 0 rgba(255,255,255,.45),inset -6px 0 0 rgba(61,10,32,.12),0 0 0 3px rgba(122,15,61,.18)}
.t-perfume::before{content:'';position:absolute;left:32px;top:-54px;width:56px;height:58px;border-radius:10px;background:linear-gradient(90deg,#2a0716,var(--wine-ink) 60%,#5a0a2c)}
.t-bear{left:1170px;top:1012px;width:150px;height:200px;--r0:34deg;--r:-6deg}
.t-bear i{position:absolute;display:block;border-radius:50%;background:#b98463}
.t-bear .ear{width:46px;height:46px;top:0}.t-bear .e1{left:14px}.t-bear .e2{right:14px}
.t-bear .head{left:20px;top:12px;width:110px;height:104px}
.t-bear .torso{left:12px;top:96px;width:126px;height:120px}
.t-bear .muz{left:52px;top:62px;width:46px;height:36px;background:#f1dcc4}
.t-bear .eye{width:10px;height:10px;top:52px;background:#2a0716}.t-bear .y1{left:52px}.t-bear .y2{left:88px}
.t-bear .bow{left:50px;top:100px;width:50px;height:22px;border-radius:6px;background:var(--rose)}

/* ---- the tag: the note, the first thing and the centre of everything ---- */
.tag-wrap{position:absolute;left:552px;top:1322px;width:380px;height:240px;transform:rotate(-6deg);transform-origin:50% 8%;
  filter:drop-shadow(0 16px 20px rgba(61,10,32,.20))}
.tag{position:absolute;inset:0;background:linear-gradient(170deg,#fffaf3,var(--cream));
  clip-path:polygon(15% 0,85% 0,100% 20%,100% 100%,0 100%,0 20%)}
.tag .hole{position:absolute;left:174px;top:14px;width:32px;height:32px;border-radius:50%;background:#e9d3d9;box-shadow:0 0 0 6px #c4b07f,inset 0 3px 4px rgba(61,10,32,.35)}
.tag .for{position:absolute;left:0;right:0;top:56px;text-align:center;font:500 15px/1 var(--brand);letter-spacing:.24em;color:var(--rose);text-transform:uppercase}
.note{position:absolute;left:30px;right:24px;top:86px;font:italic 400 29px/1.38 var(--serif);color:var(--wine-ink)}
.note .ln{display:block;position:relative;border-bottom:1px solid rgba(122,15,61,.13);padding-bottom:2px}

/* handwriting: a line is revealed left to right while a pen point leads it */
.wl{display:inline-block;position:relative;white-space:nowrap;clip-path:inset(-20% 100% -30% 0);
  animation:write calc(var(--o) - var(--d)) cubic-bezier(.35,.1,.6,1) var(--d) both}
@keyframes write{to{clip-path:inset(-20% -4% -30% 0)}}
.pen{position:absolute;left:0;top:58%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--wine-ink);opacity:0;
  animation:penGo calc(var(--o) - var(--d)) cubic-bezier(.35,.1,.6,1) var(--d) both, penOut .3s ease var(--o) forwards}
@keyframes penGo{0%{opacity:0;transform:translateX(0)}8%{opacity:1}100%{opacity:1;transform:translateX(var(--lw,300px))}}
@keyframes penOut{to{opacity:0}}

/* ---- ribbon: a strand threads the hole, a bow ties, later a twine cord ties the tag to the rim ---- */
.rib{position:absolute;left:0;top:0;width:0;height:0;overflow:visible}
.rib svg{position:absolute;left:0;top:0;overflow:visible}
.strand{fill:none;stroke:var(--wine);stroke-width:15;stroke-linecap:butt;stroke-dasharray:1 2;
  animation:draw calc(var(--tie) - var(--ribbon) - .15s) var(--ease) calc(var(--ribbon) + .1s) both, fadeOut .25s ease var(--tie) forwards}
.twine{fill:none;stroke:#b39a6a;stroke-width:5;stroke-dasharray:1 2;animation:draw .5s var(--ease) calc(var(--land) + .05s) both}
@keyframes draw{0%{stroke-dashoffset:1;visibility:hidden}0.1%{visibility:visible}100%{stroke-dashoffset:0;visibility:visible}}
@keyframes fadeOut{to{opacity:0}}
.bow{transform-box:fill-box;transform-origin:50% 50%;animation:bowTie .55s cubic-bezier(.3,1.5,.5,1) calc(var(--tie) - .05s) both}
@keyframes bowTie{from{transform:scale(.15) rotate(-25deg);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}

/* ---- the lens: captions and the ending sit on screen, not in the world ---- */
.lens{position:absolute;inset:0;z-index:20;pointer-events:none}
.lens::before{content:'';position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(0deg,rgba(247,232,236,.92),rgba(247,232,236,0))}
.cap{position:absolute;left:66px;bottom:62px;display:flex;align-items:baseline;gap:18px;font:500 30px/1 var(--sans);color:var(--ink);letter-spacing:-.005em;
  animation:capIn .6s var(--ease-out) var(--d) both, capOut .35s var(--ease) var(--o) forwards}
.cap b{font-weight:650;font-size:24px;color:var(--rose);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.cap i{font:italic 400 38px/1 var(--serif);color:var(--wine)}
@keyframes capIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes capOut{to{opacity:0;transform:translateY(-12px)}}
.story{position:absolute;left:70px;top:150px;font:italic 400 80px/1.1 var(--serif);color:var(--wine-ink);letter-spacing:-.01em}
.sign{position:absolute;left:66px;top:292px;display:flex;align-items:center;gap:22px}
.seal{width:96px;height:96px;animation:seal .7s cubic-bezier(.3,1.4,.5,1) var(--d) both}
@keyframes seal{from{opacity:0;transform:scale(1.7) rotate(-14deg)}40%{opacity:1}to{opacity:1;transform:none}}
.ring{position:absolute;left:48px;top:48px;width:96px;height:96px;margin:-48px;border-radius:50%;border:3px solid var(--rose);opacity:0;
  animation:ring .9s var(--ease-out) calc(var(--sign) + .25s) both}
@keyframes ring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(2.4)}}
.wm{font:600 62px/1 var(--brand);letter-spacing:.02em}
.wm .l{color:var(--wine)}.wm .s{color:var(--rose)}
.wm .c{display:inline-block;animation:wmIn .7s var(--ease-out) calc(var(--d) + var(--i) * .035s) both}
@keyframes wmIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.url{position:absolute;left:70px;top:418px;font:600 40px/1 var(--sans);color:var(--ink);letter-spacing:-.015em;animation:capIn .6s var(--ease-out) var(--d) both}
.small{position:absolute;left:70px;top:474px;font:400 28px/1 var(--sans);color:var(--ink-2);animation:capIn .6s var(--ease-out) var(--d) both}
</style>
</head>
<body class="hold">
<div id="reel">
  <div class="r-clock" id="clk"></div>

  <div class="world" id="world">
    <div class="w-bg"></div>

    <i class="petal" style="left:1420px;top:2080px;--r:12deg"></i>
    <i class="petal" style="left:90px;top:1240px;--r:-65deg"></i>
    <i class="petal" style="left:1710px;top:1090px;--r:20deg"></i>
    <div class="floor-shadow"></div>

    <!-- basket back: the dark inside and the handle -->
    <div class="b-back b-rise">
      <svg class="handle" viewBox="0 0 1000 640" aria-hidden="true">

        <path d="M70 600 C70 40, 930 40, 930 600" fill="none" stroke="#c9a173" stroke-width="32" stroke-linecap="round"/>

        </p>

    <!-- ribbon and twine, placed on the hole in R.onMeasure -->
    <div class="rib" id="rib">
      <svg width="1" height="1" aria-hidden="true">

        <g class="bow">

          <path d="M0 0 C50 -62,128 -40,104 14 C88 52,32 26,0 0Z" fill="#7a0f3d" stroke="#560a2b" stroke-width="5"/>
          <path d="M-4 6 C-18 52,-34 86,-58 124" fill="none" stroke="#7a0f3d" stroke-width="16"/>

        </g>

    </div>
  </div>

  <div class="lens">

    <p class="cap" data-in="ribbon+.25" data-out="wrap"><b>02</b> Ribbon <i>wine</i></p>
    <p class="cap" data-in="wrap+.2" data-out="basket"><b>03</b> Wrap <i>rose satin</i></p>
    <p class="cap" data-in="basket+.2" data-out="treats"><b>04</b> Basket <i>kraft weave</i></p>
    <p class="cap" data-in="treats+.1" data-out="story"><b>05</b> Treats</p>

    <p class="story"><span class="wl" data-in="storyW" data-out="storyEnd">Every gift tells a story.</span><i class="pen"></i></p>
    <div class="sign">
      <img class="seal" src="assets/logo-mark.png" alt="" data-in="sign">
      <i class="ring"></i>
      <p class="wm" id="wm" data-in="sign+.12"><span class="l">Little</span> <span class="s">Surprises</span></p>
    </div>
    <p class="url" data-in="sign+.6">littlesurprises.pk</p>
    <p class="small" data-in="sign+.85">Same day in Karachi, before 2 pm</p>
  </div>

</div>
<div class="r-ui"><span id="clock">0.0s</span><button type="button" id="replay">Replay</button></div>

<script>
/*
  ENGINE config. SIZE is the canvas in CSS pixels; it must match "width"/"height" in reel.json
  (9:16 1080x1920, 4:5 1080x1350, 1:1 1080x1080, 16:9 1920x1080). The renderer scales it 2x for 4K.
  CUES is the whole timeline in seconds. Only `end` (the length) is required; name the rest after your
  script's beats. Every cue becomes a CSS variable (--name) and can be used as "name+.2" in data-in /
  data-out / data-at / data-s, in R.beat() and in reel.json's sound cues.
*/
var SIZE = { w: 1080, h: 1350 };
var CUES = {
  write1: .3, write1End: 1.55, write2: 1.75, write2End: 2.55, cap1: .5,
  ribbon: 3.2, tie: 4.25,
  wrap: 5.0,
  basket: 6.6, land: 7.6,
  treats: 8.4, t1: 8.5, t2: 8.85, t3: 9.2, t4: 9.55,
  story: 10.6, storyW: 10.75, storyEnd: 11.9,
  sign: 12.2,
  end: 15
};
</script>
<script>
/* ENGINE helpers (keep). Your scripts run after this and before the boot script. */
window.R = (function(){
  var C = CUES, render = new URLSearchParams(location.search).has('render'), beats = [], measures = [];
  function at(expr){
    if (typeof expr === 'number') return expr;
    var m = String(expr).trim().match(/^([a-zA-Z_][a-zA-Z0-9_]*|[\d.]+)([+-][.\d]+)?$/);
    if (!m) throw new Error('bad cue expression: ' + expr);
    var base = isNaN(+m[1]) ? C[m[1]] : +m[1];
    if (base === undefined) throw new Error('unknown cue: ' + m[1]);
    return base + (m[2] ? +m[2] : 0);
  }
  /* wrap the text of el into spans (one per char or word), each with --i; spaces stay as text.
     Walks nested elements (an accent span inside a line keeps its colour); sets --n on el. */
  function split(el, by){
    var out = [];
    (function walk(node){
      Array.prototype.slice.call(node.childNodes).forEach(function(n){
        if (n.nodeType === 1){ walk(n); return }
        if (n.nodeType !== 3) return;
        var frag = document.createDocumentFragment();
        (by === 'words' ? n.textContent.split(/(\s+)/) : Array.from(n.textContent)).forEach(function(part){
          if (part === '') return;
          if (/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return }
          var s = document.createElement('span'); s.className = by === 'words' ? 'w' : 'c'; s.textContent = part;
          s.style.setProperty('--i', out.length); frag.appendChild(s); out.push(s);
        });
        node.replaceChild(frag, n);
      });
    })(el);
    el.style.setProperty('--n', out.length);
    return out;
  }
  /* an element's box in reel pixels (use inside R.onMeasure) */
  function box(el){
    var reel = document.getElementById('reel'), r = el.getBoundingClientRect(), Rr = reel.getBoundingClientRect(), s = Rr.width / SIZE.w;
    return { x: (r.left - Rr.left) / s, y: (r.top - Rr.top) / s, w: r.width / s, h: r.height / s,
             cx: (r.left - Rr.left + r.width / 2) / s, cy: (r.top - Rr.top + r.height / 2) / s };
  }
  /* type text into el from time t0 (seconds or cue expression), cps characters per second */
  function type(el, text, t0, cps){
    cps = cps || 30; t0 = at(t0);
    for (var i = 1; i <= text.length; i++) (function(i){ beats.push([t0 + i / cps, function(){ el.textContent = text.slice(0, i) }]) })(i);
  }
  return { C: C, W: SIZE.w, H: SIZE.h, render: render, at: at, split: split, box: box, type: type,
           beat: function(t, fn){ beats.push([at(t), fn]) },
           onMeasure: function(fn){ measures.push(fn) },
           _beats: beats, _measures: measures };
})();
</script>
<script>
/* THIS REEL: the camera. One continuous pull-back: keys are [time, scale, world focus x, y, screen x, y];
   a monotone spline through them is baked into a linear keyframe track, so it never stops or reverses. */
(function(){
  var C = R.C, K = [
    [0,        2.85, 742, 1446, 540, 690],
    [C.ribbon, 2.66, 742, 1446, 540, 690],
    [C.wrap,   1.75, 760, 1385, 560, 720],
    [C.basket, 1.25, 820, 1300, 600, 760],
    [C.treats, .95,  880, 1300, 640, 820],
    [C.story,  .72,  900, 1280, 670, 900],
    [C.sign,   .62,  900, 1250, 690, 960],
    [C.end,    .585, 900, 1250, 690, 960]];
  function mono(xs, ys){                       // Fritsch-Carlson monotone cubic
    var n = xs.length, d = [], m = [], i;
    for (i = 0; i < n - 1; i++) d[i] = (ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
    for (i = 0; i < n - 1; i++){
      if (d[i] === 0){ m[i] = m[i + 1] = 0; continue }
      var a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
      if (s > 9){ var t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i] }
    }
    return function(x){
      for (i = 0; i < n - 2 && x > xs[i + 1]; i++);
      var h = xs[i + 1] - xs[i], t = Math.min(1, Math.max(0, (x - xs[i]) / h)), t2 = t * t, t3 = t2 * t;
      return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * h * m[i + 1];
    };
  }
  var ts = K.map(function(k){ return k[0] }), col = function(j, f){ return mono(ts, K.map(function(k){ return f ? f(k[j]) : k[j] })) };
  var ls = col(1, Math.log), fx = col(2), fy = col(3), sx = col(4), sy = col(5), N = 180, out = [];
  for (var k = 0; k <= N; k++){
    var t = C.end * k / N, s = Math.exp(ls(t));
    out.push((k * 100 / N).toFixed(3) + '%{transform:translate(' + (sx(t) - s * fx(t)).toFixed(2) + 'px,' + (sy(t) - s * fy(t)).toFixed(2) + 'px) scale(' + s.toFixed(5) + ')}');
  }
  var st = document.createElement('style'); st.textContent = '@keyframes cam{' + out.join('') + '}'; document.head.appendChild(st);

  /* the pen point travels the width of its line */
  R.onMeasure(function(){
    document.querySelectorAll('.wl').forEach(function(w){ w.parentNode.querySelector('.pen').style.setProperty('--lw', w.offsetWidth + 'px') });
    /* ribbon and twine sit on the tag's hole; the twine runs up to the basket's rim */
    var h = R.box(document.getElementById('hole')), rib = document.getElementById('rib');
    rib.style.left = h.cx + 'px'; rib.style.top = h.cy + 'px';
    document.getElementById('twine').setAttribute('d', 'M0 0 C 6 -60, 40 -110, 52 ' + (1186 - h.cy).toFixed(1));
  });
  R.split(document.getElementById('wm'), 'chars');
})();
</script>
<script>
/* ENGINE boot (keep) */
(function(){
  var C = CUES, $ = function(id){ return document.getElementById(id) };
  var reel = $('reel'), render = R.render, root = document.documentElement.style;
  if (render) document.documentElement.classList.add('render');
  root.setProperty('--W', SIZE.w); root.setProperty('--H', SIZE.h);

  /* every cue is a CSS variable */
  for (var k in C) root.setProperty('--' + k, C[k].toFixed(3) + 's');
  /* data-in / data-out / data-s / data-at: a cue name with an optional +offset ("demo+.12"), or a number */
  document.querySelectorAll('[data-in]').forEach(function(el){
    el.style.setProperty('--d', R.at(el.dataset.in).toFixed(3) + 's');
    el.style.setProperty('--o', R.at(el.dataset.out || 'end+1').toFixed(3) + 's');
  });
  document.querySelectorAll('[data-s]').forEach(function(el){ el.style.setProperty('--s', R.at(el.dataset.s).toFixed(3) + 's') });
  document.querySelectorAll('[data-at]').forEach(function(el){ el.style.setProperty('--at', R.at(el.dataset.at).toFixed(3) + 's') });

  /* Preview: fit the canvas into the window */
  function fit(){
    if (render) return;
    var s = Math.min(innerWidth / SIZE.w, innerHeight / SIZE.h);
    reel.style.transform = 'translate(' + ((innerWidth - SIZE.w * s) / 2) + 'px,' + ((innerHeight - SIZE.h * s) / 2) + 'px) scale(' + s + ')';
  }
  fit(); addEventListener('resize', fit);

  /* Positions in reel pixels: measured unscaled and with animations off.
     .r-fit: big text that must not overflow; its direct child spans are lines (else it is one line). It is
     shrunk to its parent's width (or the canvas minus 48 px a side). Cut words first; this is a safety net. */
  function measure(){
    var keep = reel.style.transform; reel.style.transform = 'none';
    reel.classList.add('measure');
    document.querySelectorAll('.r-fit').forEach(function(h){
      var room = Math.min(h.parentNode.clientWidth || SIZE.w, SIZE.w - 96), widest = 0;
      var lines = Array.prototype.filter.call(h.children, function(c){
        return c.tagName === 'SPAN' && !c.classList.contains('c') && !c.classList.contains('w') });
      if (!lines.length) lines = [h];
      lines.forEach(function(s){ widest = Math.max(widest, s.scrollWidth) });
      if (widest > room) h.style.fontSize = (parseFloat(getComputedStyle(h).fontSize) * room / widest * .98).toFixed(1) + 'px';
    });
    R._measures.forEach(function(fn){ fn() });
    reel.classList.remove('measure');
    reel.style.transform = keep;
  }

  /* load every @font-face declared (even ones no element uses yet), then wait for the rest */
  var fonts = []; document.fonts.forEach(function(f){ fonts.push(f.load().catch(function(){})) });
  window.reelReady = Promise.all(fonts).then(function(){ return document.fonts.ready }).then(function(){
    measure();
    window.REEL = { cues: C, duration: C.end, width: SIZE.w, height: SIZE.h };
  });
  window.startReel = function(){
    document.body.classList.remove('hold');
    var BEATS = R._beats;
    if (render){ BEATS.forEach(function(b){ setTimeout(b[1], b[0] * 1000) }); return }
    // Preview follows the CSS clock, so beats never drift from the animation (a hidden tab pauses CSS, not timers)
    var ref = $('clk').getAnimations()[0], left = BEATS.slice().sort(function(x, y){ return x[0] - y[0] });
    (function tick(){
      var t = (ref.currentTime || 0) / 1000;
      while (left.length && left[0][0] <= t) left.shift()[1]();
      $('clock').textContent = Math.min(t, C.end).toFixed(1) + 's';
      if (t < C.end) requestAnimationFrame(tick);
    })();
  };
  $('replay').onclick = function(){ location.reload() };
  if (!render) window.reelReady.then(window.startReel);
})();
</script>
