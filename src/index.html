<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Little Surprises · Personalized with Love, Delivered with Care</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Little Surprises: personalized gift baskets for every occasion, or build your own — basket, wrap, ribbon, treats and a handwritten note. Same-day delivery in Karachi." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121012" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta property="og:site_name" content="Little Surprises" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://littlesurprises.pk/brand/logo-full.webp" />
    <script>
      // Apply a previewed appearance before first paint (design page toggle).
      try {
        var t = localStorage.getItem('gw-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
